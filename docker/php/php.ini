; TilBuci PHP overrides
; Applied to both the Apache module and the CLI SAPI.

; Large ZIP uploads/imports (movies) require generous limits.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M

; Time to process big ZIP imports and exports.
max_execution_time = 300
max_input_time = 300

; TilBuci relies on the ZipArchive class, enabled by the php-zip package.
; Keep error reporting useful in the container logs.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
