# TilBuci Apache virtual host.
# DocumentRoot points to the TilBuci public folder (public_html).

# Suppress the "Could not reliably determine the server's fully qualified
# domain name" warning at startup.
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/tilbuci/public_html

    <Directory /var/www/tilbuci/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Persistently linked folders (movie, font, sites, pwa) live under /data.
    <Directory /data>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
