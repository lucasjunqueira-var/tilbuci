<html lang="en">
<head>
	<meta charset="utf-8">

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="[SITECOLOR]">
	<link rel="shortcut icon" type="image/png" href="./favicon.png">

	<meta property="og:title" content="[SITETITLE]" />
	[SITESHAREIMG]
	<meta property="og:type" content="website" />

	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
        
        // running from an installed pwa?
        function TBB_installedPwa() {
            if (TBB_isIos()) {
                return (window.navigator.standalone === true);
            } else {
                return (window.matchMedia('(display-mode: standalone)').matches);
            }
        }
        
        // service worker initialize
		if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('serviceWorker.js');
		}
        
        // pwa install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
        function TBB_showInstallPrompt() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        // PWA installation accepted
                        deferredPrompt = null;
                    } else {
                        // PWA installation dismissed
                    }
                });
            }
        }
	</script>
	<style>
		[SITEFONTS]
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #666666; }
        #TilBuciArea { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000000; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
	</style>
</head>
<body>
    <div id="TilBuciArea">
        <noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
        <div id="openfl-content"></div>
        <script type="text/javascript">
            let params = new URLSearchParams(window.location.search);
			let vars = params.get("vars");
			if (vars == null) vars = "";
            let snippet = params.get("sn");
			if (snippet == null) snippet = "";
            lime.embed ("TilBuci", "openfl-content", 0, 0, { parameters: { "mode": "player", "movie": "[SITEMOVIE]", "scene": "[SITESCENE]", "vars":vars, "snippet":snippet, "ws": "[SITEWS]" [PARAMEXTRA] } });
        </script>
        [SITEPLUGINEND]
    </div>
    <video autoplay loop muted playsinline style="display:none">
        <source src="blank.mp4" type="video/mp4">
    </video>
    <script>
        // send commands to board hardware
        function TBShowtime_Hardware(msg) {
            const url = `http://[SITE]/api/hardware?command=${encodeURIComponent(msg)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // register an event at the SD card
        function TBShowtime_Event(movie, eventName, jsonStr) {
            const now = new Date();
            const timestamp = now.getFullYear().toString() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0') +
                String(now.getSeconds()).padStart(2, '0');
            const adjustedEventName = eventName + timestamp;
            const url = `http://[SITE]/api/setevent?set=${encodeURIComponent(adjustedEventName)}&value=${encodeURIComponent(jsonStr)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // get an unique name for this instance
        function TBShowtime_Getname() {
            const url = `http://[SITE]/api/name`;
            try {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url, false);
                xhr.setRequestHeader("Content-Type", "application/json");
                xhr.send(null);
                if (xhr.status === 200) {
                    try {
                        return JSON.parse(xhr.responseText);
                    } catch (e) {
                        return xhr.responseText;
                    }
                } else {
                    return('all');
                }
            } catch (err) {
                return fetch(url, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json());
            }
        }
        // register a value at the SD card
        function TBShowtime_Setval(setname, setvalue, name) {
            const url = `http://[SITE]/api/setval?set=${encodeURIComponent(setname)}&value=${encodeURIComponent(setvalue)}&name=${encodeURIComponent(name)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // retrive a registered value from the SD card
        function TBShowtime_Getval(getname, name) {
            const url = `http://[SITE]/api/getval?get=${encodeURIComponent(getname)}&name=${encodeURIComponent(name)}`;
            try {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url, false);
                xhr.setRequestHeader("Content-Type", "application/json");
                xhr.send(null);
                if (xhr.status === 200) {
                    try {
                        return JSON.parse(xhr.responseText);
                    } catch (e) {
                        return xhr.responseText;
                    }
                } else {
                    return('all');
                }
            } catch (err) {
                return fetch(url, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json());
            }
        }
        // remove a value fomr the SD card
        function TBShowtime_Delval(delname, name) {
            const url = `http://[SITE]/api/delval?get=${encodeURIComponent(delname)}&name=${encodeURIComponent(name)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // remove all registered values on the SD card
        function TBShowtime_Delallval(name) {
            const url = `http://[SITE]/api/delallval?name=${encodeURIComponent(name)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // register a global value at the SD card
        function TBShowtime_Setglobal(setname, setvalue) {
            const url = `http://[SITE]/api/setglobal?set=${encodeURIComponent(setname)}&value=${encodeURIComponent(setvalue)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // retrive a registered global value at the SD card
        function TBShowtime_Getglobal(getname) {
            const url = `http://[SITE]/api/getglobal?get=${encodeURIComponent(getname)}`;
            try {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url, false);
                xhr.setRequestHeader("Content-Type", "application/json");
                xhr.send(null);
                if (xhr.status === 200) {
                    try {
                        return JSON.parse(xhr.responseText);
                    } catch (e) {
                        return xhr.responseText;
                    }
                } else {
                    return('all');
                }
            } catch (err) {
                return fetch(url, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json());
            }
        }
        // delete a registered global value at the SD card
        function TBShowtime_Delglobal(delname) {
            const url = `http://[SITE]/api/delglobal?get=${encodeURIComponent(delname)}`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }
        // delete all global values from the SD card
        function TBShowtime_Delallglobal() {
            const url = `http://[SITE]/api/delallglobal`;
            fetch(url, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
        }

        // SSE (Server-Send Events) configuration
        var tilbuci_events = new EventSource('/events');
        tilbuci_events.onopen = function (event) {
            console.log('SSE connected');
        };
        tilbuci_events.onmessage = function (event) {
            if (typeof window.tilbuci_runaction === 'function') {
            window.tilbuci_runaction(event.data);
            }
        };
        tilbuci_events.onerror = function (event) {
            console.log('SSE connection error - retrying...');
        };

		// Wake Lock API
		(function () {
			'use strict';
			var wakeLock = null;
			function activateWakeLock() {
				if (!('wakeLock' in navigator)) {
					console.log('Wake Lock API not supported.');
					return;
				}
				navigator.wakeLock.request('screen')
					.then(function (lock) {
						wakeLock = lock;
					})
					.catch(function (err) {
						wakeLock = null;
						console.log('Wake Lock error: ' + err.name);
					});
			}
			function restartWakeLock() {
				if (document.visibilityState === 'visible') {
					activateWakeLock();
				}
			}
			window.addEventListener('focus', activateWakeLock);
			document.addEventListener('visibilitychange', restartWakeLock);
			window.addEventListener('beforeunload', function () {
				if (wakeLock !== null) {
					wakeLock.release().catch(function () {});
					wakeLock = null;
				}
			});
			activateWakeLock();
		})();
	</script>
</body>
</html>
